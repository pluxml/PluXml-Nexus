name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (PHP 8.5)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        coverage: none
        tools: composer:v2

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/composer
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Audit dependencies
      run: composer audit --locked

    - name: Check platform requirements
      run: composer check-platform-reqs

    - name: Lint PHP files
      run: find App config public tests views -type f -name '*.php' -print0 | xargs -0 -n1 php -l

    - name: PHPStan static analysis
      run: vendor/bin/phpstan analyse App config views --no-progress

  php-versions:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP ${{ matrix.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none
        tools: composer:v2

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/composer
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Lint PHP files
      run: find App config views -type f -name '*.php' -print0 | xargs -0 -n1 php -l

    - name: PHPStan static analysis
      run: vendor/bin/phpstan analyse App config views --no-progress

  tests:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        coverage: none
        tools: composer:v2

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/composer
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --no-interaction --prefer-dist --no-progress

    - name: Run test suite
      run: composer test
